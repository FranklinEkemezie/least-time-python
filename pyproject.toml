[project]
name = "least-time-refraction"
version = "0.1.0"
description = "An interactive visualization of least-time paths and Snell's law."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "plotly>=5.20",
    "scipy>=1.12",
    "streamlit>=1.32",
]

[project.optional-dependencies]
animation = ["manim>=0.18.1"]

[project.scripts]
least-time-native = "least_time.native_ui.desktop:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/least_time"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
